  pointer-events: none;

  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  vertical-align: middle;
}

/* index */

  position: fixed !important;
  bottom: 30px !important;
  left: 0 !important;
}


/* video */
.mejs-duration-container, .mejs-time-rail, .mejs-fullscreen-button { 
  display: none !important;
}

  background: none !important;
  height: auto !important;
}

  margin: 0 auto !important;
}

.ce-video .mejs-container {
  background:transparent !important;
}

    cursor: none !important;
}

.rounded .thumb a img {
  border-radius: 10px;
}

  border-radius: 10px;
  overflow: hidden;
}

.post-password-form .inner .password-lock,
.post-password-form .inner .title,
.post-password-form .inner .subtitle {
    display:none !important;
}

.pswp__top-bar, .pswp__button {
  display:none !important;
}

  pointer-events: none !important;
}

  const isMobile = /Mobi|Android|iPad|iPhone/i.test(navigator.userAgent);

      transformOrigin: "center center"
    });

    gsap.timeline({
      scrollTrigger: {
        trigger: element,
        start: "top top",
        end: "+=300%",
        pin: true,
        pinSpacing: false,
        scrub: true,
        anticipatePin: .5,
        invalidateOnRefresh: true
      }
    })

      scale: 0.75,
      duration: 3,
      ease: "power1.out"
    })
    .to(element, {
      opacity: 0,
      duration: 1,
      ease: "power1.out"
    }, "-=1");

  });

  ScrollTrigger.sort();
  ScrollTrigger.refresh();

  gsap.delayedCall(1, () => {
    gsap.to(window, {
      duration: 1.5,
      scrollTo: {
        y: window.innerHeight * 0.5,
        autoKill: true
      },
      ease: "expo.inOut"
    });
  });

});

			<script type="text/javascript" id="semplice-custom-javascript">document.addEventListener('DOMContentLoaded', () => {
  // Reset scroll
  if (history.scrollRestoration) {
    history.scrollRestoration = "manual";
  }
  


 // Select all content blocks
  const contentBlocks = document.querySelectorAll('.column-content, .hero, .background-video');

  // Create a timeline for the staggered animations
  const tl = gsap.timeline();

  // Stagger the animations with a 0.1s (100ms) delay between each
  tl.from(contentBlocks, {
    opacity: 0,
    y: 30,
    stagger: 0.1,             // Adjust the delay between each element here (0.1 = 100ms)
    duration: 1,              // Duration of each animation
    ease: "power3.out",
    onStart: () => {
      // Make the elements visible when the animation starts
      gsap.set(contentBlocks, { visibility: 'visible' });
    }
  });

  // Page transition effect - fade out the .sections wrapper
  document.querySelectorAll('a[href]').forEach(link => {
    link.addEventListener('click', function (e) {
      // Check if the link is internal and not opening in a new tab
      if (this.hostname === window.location.hostname && !this.target) {
        e.preventDefault();  // Prevent default link click behavior
        const targetUrl = this.href;  // Save the target URL

        // Fade out the .sections wrapper
        gsap.to('.sections', {
          opacity: 0,
          duration: 0.5,
          ease: "power3.out",
          onComplete: function () {
            window.location.href = targetUrl;  // Navigate to the new page
          }
        });
      }
    });
  });

function isDesktop() {
    return /Mobi|Android|iPad|iPhone/i.test(navigator.userAgent);
  }
  
  if (!isDesktop()) {
  
	// Create and style the "Play" cursor element
	const playCursor = document.createElement('div');
	playCursor.id = 'playCursor'; // Set the ID for the div

	playCursor.innerText = 'Play';
	document.body.appendChild(playCursor);

	// Update position of the cursor element
	function updateCursorPosition(event) {
	  const { clientX, clientY } = event;
	  const { offsetWidth: width, offsetHeight: height } = playCursor;
	  playCursor.style.left = `${clientX - width / 2}px`;
	  playCursor.style.top = `${clientY - height / 2}px`;
	}

	// Show "Play" text and hide default cursor
	function showPlayCursor(event) {
	  playCursor.style.opacity = '1'; // Fade in by setting opacity to 1
	  document.body.style.cursor = 'none';
	  updateCursorPosition(event); // Update position immediately on show
	}

	// Hide "Play" text and restore default cursor
	function hidePlayCursor() {
	  playCursor.style.opacity = '0'; // Fade out by setting opacity to 0
	  document.body.style.cursor = 'default';
	}

	// Attach event listeners to overlay elements
	const overlayElements = document.querySelectorAll('.mejs-overlay-play');
	overlayElements.forEach(overlay => {
	  overlay.addEventListener('mousemove', updateCursorPosition);
	  overlay.addEventListener('mouseenter', showPlayCursor);
	  overlay.addEventListener('mouseleave', hidePlayCursor);
	});

	// Optionally, listen to mousemove on the whole document for consistent cursor updates
	document.addEventListener('mousemove', updateCursorPosition);
	
  }

});
