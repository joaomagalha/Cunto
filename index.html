<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>José Cunto Neto — Fotografia Artística</title>
    <meta name="description" content="Portfólio de fotografia artística e documental de José Cunto Neto. Cuiabá, Mato Grosso, Brasil." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet" />


    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:         #fafafa;
            --ink:        #18181b;
            --ink-mid:    #71717a;
            --ink-light:  #a1a1aa;
            --ink-xlight: #d4d4d8;
            --expo:       cubic-bezier(0.16, 1, 0.3, 1);
        }

        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--ink);
            overflow-x: hidden;
            cursor: none;
        }

        img { display: block; width: 100%; height: 100%; object-fit: cover; }

        /* ── CURSOR ───────────────────────────────────────────── */
        .cursor {
            position: fixed;
            top: 0; left: 0;
            width: 7px; height: 7px;
            background: var(--ink);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width .22s var(--expo), height .22s var(--expo), opacity .2s;
            will-change: transform;
        }

        .cursor-ring {
            position: fixed;
            top: 0; left: 0;
            width: 36px; height: 36px;
            border: 1px solid rgba(24,24,27,.32);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width .42s var(--expo), height .42s var(--expo), background .3s, border-color .3s, opacity .2s;
            will-change: transform;
        }

        body.on-img  .cursor                { width: 0; height: 0; opacity: 0; }
        body.on-img  .cursor-ring           { width: 68px; height: 68px; background: rgba(24,24,27,.04); border-color: rgba(24,24,27,.10); }
        body.on-link .cursor-ring           { width: 52px; height: 52px; background: rgba(24,24,27,.06); }

        /* ── NAV ──────────────────────────────────────────────── */
        .nav {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2.25rem 3.5rem;
            transition:
                padding       .6s var(--expo),
                background    .6s var(--expo),
                backdrop-filter .6s var(--expo),
                border-color  .6s var(--expo);
            border-bottom: 1px solid transparent;
        }

        .nav.scrolled {
            padding: 1.2rem 3.5rem;
            background: rgba(250,250,250,.88);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-color: rgba(24,24,27,.06);
        }

        .nav__logo {
            font-size: .9375rem;
            font-weight: 600;
            letter-spacing: -.01em;
            color: var(--ink);
            text-decoration: none;
            position: relative;
        }
        .nav__logo::after {
            content: '';
            position: absolute;
            left: 0; bottom: -2px;
            width: 100%; height: 1px;
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .44s var(--expo);
        }
        .nav__logo:hover::after { transform: scaleX(1); }

        .nav__list {
            display: flex;
            align-items: center;
            gap: 2.75rem;
            list-style: none;
        }

        .nav__link {
            font-size: .6875rem;
            font-weight: 400;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--ink-mid);
            text-decoration: none;
            position: relative;
            transition: color .3s;
        }
        .nav__link::after {
            content: '';
            position: absolute;
            left: 0; bottom: -3px;
            width: 100%; height: 1px;
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform .4s var(--expo);
        }
        .nav__link:hover { color: var(--ink); }
        .nav__link:hover::after { transform: scaleX(1); transform-origin: left; }

        @keyframes grad-pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: .72; }
        }

        /* ── HERO ─────────────────────────────────────────────── */
        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background: var(--bg);
        }

        /* Images */
        .himg {
            position: absolute;
            overflow: hidden;
            /* hidden until entrance animation */
            clip-path: inset(0 0 100% 0);
            will-change: clip-path, transform;
        }
        .himg img {
            transform: scale(1.08);
            will-change: transform;
        }

        /* tall portrait — left */
        .himg-1 {
            top: 0; left: 4vw;
            width: 26vw; height: 72vh;
            z-index: 1;
        }

        /* wide landscape — right */
        .himg-2 {
            top: 32vh; right: 3vw;
            width: 41vw; height: 47vh;
            z-index: 1;
        }

        /* small accent — bottom centre */
        .himg-3 {
            bottom: 10vh; right: 29vw;
            width: 17vw; height: 22vh;
            z-index: 1;
        }

        /* hover overlay */
        .himg__overlay {
            position: absolute;
            inset: 0;
            background: var(--ink);
            opacity: 0;
            pointer-events: none;
            transition: opacity .6s var(--expo);
        }

        /* Title — centrado no viewport */
        .htitle {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            user-select: none;
            pointer-events: none;
        }

        .htitle__eyebrow {
            display: block;
            font-size: .6875rem;
            font-weight: 500;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--ink-mid);
            margin-bottom: 1.75rem;
            opacity: 0;
            transform: translateY(10px);
        }

        .htitle__first {
            display: block;
            font-size: clamp(2.5rem, 4.5vw, 6rem);
            font-weight: 300;
            letter-spacing: -.04em;
            line-height: 1;
            background: linear-gradient(to right, #a1a1aa, #3f3f46, #a1a1aa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            /* initial state — GSAP revela */
            opacity: 0;
            transform: translateY(28px);
            will-change: opacity, transform;
        }

        /* O nome principal — gradiente igual ao design system */
        .htitle__last {
            display: block;
            font-size: clamp(5rem, 12.5vw, 16rem);
            font-weight: 700;
            letter-spacing: -.065em;
            line-height: .88;
            background: linear-gradient(to right, #a1a1aa, #3f3f46, #a1a1aa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            /* initial state — GSAP revela */
            opacity: 0;
            transform: translateY(48px);
            will-change: opacity, transform;
        }

        .htitle__sub {
            display: block;
            font-size: .6875rem;
            font-weight: 400;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--ink-light);
            margin-top: 1.75rem;
            opacity: 0;
            transform: translateY(10px);
        }

        /* Bottom bar */
        .hbottom {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 0 3.5rem 3.25rem;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            z-index: 3;
        }

        .hmeta {
            opacity: 0;
            transform: translateY(14px);
        }
        .hmeta p {
            font-size: .6875rem;
            font-weight: 400;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-mid);
            line-height: 2;
        }

        .hcta { opacity: 0; }

        .hcta__link {
            display: inline-flex;
            align-items: center;
            gap: .875rem;
            font-size: .6875rem;
            font-weight: 500;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink);
            text-decoration: none;
            padding: .9375rem 2.125rem;
            border: 1px solid var(--ink);
            position: relative;
            overflow: hidden;
            transition: color .42s var(--expo);
        }
        .hcta__link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .44s var(--expo);
            z-index: 0;
        }
        .hcta__link span { position: relative; z-index: 1; }
        .hcta__link:hover { color: var(--bg); }
        .hcta__link:hover::before { transform: scaleX(1); }
        .hcta__arrow { display: inline-block; transition: transform .4s var(--expo); }
        .hcta__link:hover .hcta__arrow { transform: translateY(4px); }

        .hscroll {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .875rem;
            opacity: 0;
            transform: translateY(14px);
        }
        .hscroll__label {
            font-size: .5625rem;
            font-weight: 500;
            letter-spacing: .28em;
            text-transform: uppercase;
            color: var(--ink-light);
            writing-mode: vertical-rl;
        }
        .hscroll__line {
            width: 1px;
            height: 0;
            background: var(--ink-light);
        }

        /* Decorative side year */
        .hyear {
            position: absolute;
            top: 50%; right: 2.5vw;
            transform: translateY(-50%) rotate(90deg);
            font-size: .5625rem;
            font-weight: 400;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--ink-xlight);
            z-index: 3;
            opacity: 0;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ── RESPONSIVE ───────────────────────────────────────── */
        @media (max-width: 1280px) {
            .himg-1 { width: 30vw; }
            .himg-2 { width: 45vw; }
            .himg-3 { width: 20vw; right: 32vw; }
            .htitle { left: 26vw; }
        }

        @media (max-width: 1024px) {
            .nav, .nav.scrolled { padding-left: 2rem; padding-right: 2rem; }
            .himg-1  { width: 36vw; height: 60vh; left: 3vw; }
            .himg-2  { width: 52vw; right: 2vw; top: 36vh; height: 42vh; }
            .himg-3  { width: 24vw; height: 22vh; right: 40vw; bottom: 9vh; }
            .htitle__last { font-size: clamp(4.5rem, 11vw, 12rem); }
            .hbottom { padding: 0 2rem 3rem; }
        }

        @media (max-width: 768px) {
            body { cursor: auto; }
            .cursor, .cursor-ring { display: none; }
            .nav, .nav.scrolled { padding-left: 1.5rem; padding-right: 1.5rem; }
            .nav__list { gap: 1.5rem; }

            /* Mobile — full reimagination, not just stacking */
            .himg-1 { top: 8vh; left: 0; width: 56vw; height: 44vh; z-index: 1; }
            .himg-2 { top: auto; right: 0; bottom: 18vh; width: 68vw; height: 33vh; z-index: 1; }
            .himg-3 { left: 4vw; right: auto; bottom: 20vh; width: 38vw; height: 21vh; z-index: 1; }

            .htitle  {
                position: absolute;
                inset: auto;
                top: auto; left: 0; right: 0;
                bottom: 27vh;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: flex-end;
                padding: 0 1.5rem;
                z-index: 2;
                text-align: left;
            }

.htitle__first { font-size: clamp(2rem, 9vw, 4rem); }
            .htitle__last  { font-size: clamp(3.5rem, 17vw, 7rem); }
            .htitle__eyebrow { margin-bottom: 1.25rem; }
            .htitle__sub     { margin-top: 1.25rem; }

            .hbottom { padding: 0 1.5rem 2.5rem; }
            .hyear   { display: none; }
        }

        @media (max-width: 520px) {
            .nav__list  { display: none; }
            .htitle__last { font-size: clamp(3rem, 19vw, 5.5rem); }
            .himg-1 { width: 62vw; height: 40vh; }
        }
    </style>
</head>
<body>

    <div class="cursor"      id="js-cursor" aria-hidden="true"></div>
    <div class="cursor-ring" id="js-ring"   aria-hidden="true"></div>

    <!-- ── Navigation ────────────────────────────────────────── -->
    <nav class="nav" id="js-nav" role="navigation" aria-label="Navegação principal">
        <a href="#" class="nav__logo" aria-label="José Cunto Neto — Início">Cunto</a>
        <ul class="nav__list" role="list">
            <li><a href="#portfolio" class="nav__link">Portfólio</a></li>
            <li><a href="#sobre"     class="nav__link">Sobre</a></li>
            <li><a href="#contato"   class="nav__link">Contato</a></li>
        </ul>
    </nav>

    <!-- ── Hero ──────────────────────────────────────────────── -->
    <section class="hero" id="hero" aria-labelledby="hero-name">

        <!-- Image 1 — tall portrait, left, behind title -->
        <figure class="himg himg-1">
            <img
                src="Assets/Imagens/Sem Cor/Sem-Título-1.png"
                alt="Retrato artístico em preto e branco — José Cunto Neto"
                loading="eager"
            />
            <div class="himg__overlay" aria-hidden="true"></div>
        </figure>

        <!-- Title block — sits above img-1, below img-2 -->
        <div class="htitle">
            <small class="htitle__eyebrow" aria-hidden="true">Fotografia Artística</small>
            <span class="htitle__first" id="hero-name">José</span>
            <h1  class="htitle__last">Cunto</h1>
            <small class="htitle__sub" aria-hidden="true">Cuiabá · Mato Grosso</small>
        </div>

        <!-- Image 2 — landscape, right, in front of title (editorial overlap) -->
        <figure class="himg himg-2">
            <img
                src="Assets/Imagens/Sem Cor/Sem-Título-5.png"
                alt="Paisagem documental em preto e branco — José Cunto Neto"
                loading="eager"
            />
            <div class="himg__overlay" aria-hidden="true"></div>
        </figure>

        <!-- Image 3 — small accent, foreground -->
        <figure class="himg himg-3">
            <img
                src="Assets/Imagens/Sem Cor/Sem-Título-11.png"
                alt="Fotografia artística em preto e branco — José Cunto Neto"
                loading="eager"
            />
            <div class="himg__overlay" aria-hidden="true"></div>
        </figure>

        <span class="hyear" aria-hidden="true">Acervo — Cuiabá, MT</span>

        <!-- Bottom row -->
        <div class="hbottom" aria-hidden="true">

            <div class="hmeta">
                <p>José Cunto Neto</p>
                <p>Fotógrafo — Brasil</p>
            </div>

            <div class="hcta">
                <a href="#portfolio" class="hcta__link" aria-label="Ver portfólio completo">
                    <span>Ver Portfólio</span>
                    <span class="hcta__arrow" aria-hidden="true">↓</span>
                </a>
            </div>

            <div class="hscroll">
                <span class="hscroll__label">Scroll</span>
                <div  class="hscroll__line" id="js-sline"></div>
            </div>

        </div>
    </section>

    <!-- ── Libraries ─────────────────────────────────────────── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

    <script>
    (function () {
        'use strict';

        /* ── GSAP ───────────────────────────────────────────── */
        gsap.registerPlugin(ScrollTrigger);

        /* ── Lenis + GSAP integration ───────────────────────── */
        const lenis = new Lenis({
            duration: 1.4,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        });

        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => lenis.raf(time * 1000));
        gsap.ticker.lagSmoothing(0);

        /* ── Entrance timeline ──────────────────────────────── */
        const E = 'expo.out';
        const tl = gsap.timeline({ defaults: { ease: E } });

        // Images reveal (curtain rising + descale)
        tl.to('.himg', {
            clipPath: 'inset(0 0 0% 0)',
            duration: 1.7,
            stagger: 0.28,
        }, 0.15);

        tl.to('.himg img', {
            scale: 1,
            duration: 2.2,
            stagger: 0.28,
        }, 0.15);

        // Eyebrow
        tl.to('.htitle__eyebrow', { opacity: 1, y: 0, duration: 1.0 }, 0.7);

        // "José" — bloco inteiro
        tl.to('.htitle__first', { opacity: 1, y: 0, duration: 1.0 }, 0.9);

        // "Cunto" — bloco inteiro, ligeiramente atrasado
        tl.to('.htitle__last', { opacity: 1, y: 0, duration: 1.2 }, 1.05);

        // Subtitle
        tl.to('.htitle__sub',  { opacity: 1, y: 0, duration: 0.9 }, 1.5);

        // Year
        tl.to('.hyear',        { opacity: 1,        duration: 1.2 }, 1.5);

        // Meta + CTA + scroll
        tl.to('.hmeta',        { opacity: 1, y: 0,  duration: 0.9 }, 1.65);
        tl.to('.hcta',         { opacity: 1,        duration: 0.9 }, 1.75);
        tl.to('.hscroll',      { opacity: 1, y: 0,  duration: 0.9 }, 1.85);

        // Scroll line grows
        tl.to('#js-sline', {
            height: 56,
            duration: 1.4,
            ease: 'power2.inOut',
        }, 2.1);

        /* ── Scroll parallax ────────────────────────────────── */
        const scrubTargets = [
            { sel: '.himg-1',  y: -70, scrub: 1.5 },
            { sel: '.himg-2',  y: -40, scrub: 2.0 },
            { sel: '.himg-3',  y: -90, scrub: 1.2 },
            { sel: '.htitle',  y: -95, scrub: 1.3 },
        ];

        scrubTargets.forEach(({ sel, y, scrub }) => {
            gsap.to(sel, {
                y,
                ease: 'none',
                scrollTrigger: {
                    trigger: '.hero',
                    start: 'top top',
                    end: 'bottom top',
                    scrub,
                },
            });
        });

        /* ── Image hover — elegant scale ────────────────────── */
        document.querySelectorAll('.himg').forEach((fig) => {
            const img     = fig.querySelector('img');
            const overlay = fig.querySelector('.himg__overlay');

            fig.addEventListener('mouseenter', () => {
                gsap.to(img,     { scale: 1.055, duration: 0.85, ease: E });
                gsap.to(overlay, { opacity: 0.06, duration: 0.5 });
            });
            fig.addEventListener('mouseleave', () => {
                gsap.to(img,     { scale: 1,    duration: 1.3,  ease: E });
                gsap.to(overlay, { opacity: 0,   duration: 0.5 });
            });
        });

        /* ── Custom cursor ──────────────────────────────────── */
        const isTouch = window.matchMedia('(hover: none)').matches;
        const cursorEl = document.getElementById('js-cursor');
        const ringEl   = document.getElementById('js-ring');

        if (!isTouch && cursorEl && ringEl) {
            let mx = window.innerWidth  / 2;
            let my = window.innerHeight / 2;
            let rx = mx, ry = my;

            document.addEventListener('mousemove', (e) => {
                mx = e.clientX; my = e.clientY;
                gsap.set(cursorEl, { x: mx, y: my });
            }, { passive: true });

            (function ringLoop() {
                rx += (mx - rx) * 0.11;
                ry += (my - ry) * 0.11;
                gsap.set(ringEl, { x: rx, y: ry });
                requestAnimationFrame(ringLoop);
            }());

            document.querySelectorAll('.himg, figure').forEach((el) => {
                el.addEventListener('mouseenter', () => document.body.classList.add('on-img'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('on-img'));
            });
            document.querySelectorAll('a, button').forEach((el) => {
                el.addEventListener('mouseenter', () => document.body.classList.add('on-link'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('on-link'));
            });
        }

        /* ── Navbar scroll state ────────────────────────────── */
        const nav = document.getElementById('js-nav');
        window.addEventListener('scroll', () => {
            nav.classList.toggle('scrolled', window.scrollY > 60);
        }, { passive: true });

    }());
    </script>
</body>
</html>
